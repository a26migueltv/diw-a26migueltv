<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descarga con riego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="invernadero">
    <h1>Tu archivo está germinando</h1>
    <p class="instruccion">Riega la planta. Cuando florezca, se descarga. Sin prisas, que se ahoga.</p>

    <div class="jardin">
      <!-- La regadera ES el botón de descarga -->
      <button class="regadera" id="regadera" type="button" aria-label="Regar la planta">
        <svg viewBox="0 0 120 90" aria-hidden="true">
          <path class="regadera-asa" d="M32 32 C 32 8, 68 8, 68 32" />
          <path class="regadera-pitorro" d="M78 58 L 112 26" />
          <circle class="regadera-alcachofa" cx="113" cy="25" r="7" />
          <rect class="regadera-cuerpo" x="20" y="30" width="60" height="46" rx="9" />
        </svg>
      </button>

      <!-- Aquí se crean las gotas desde JS -->
      <div class="gotas" id="gotas" aria-hidden="true"></div>

      <!-- Planta en SVG: el orden importa, la maceta se pinta encima del tallo -->
      <svg class="planta" id="planta" viewBox="0 0 200 260" aria-hidden="true">
        <path class="tallo" pathLength="1" d="M100 200 C 96 170, 106 140, 100 110 S 98 80, 100 62" />
        <path class="hoja hoja--1" d="M100 160 C 75 150, 62 160, 58 170 C 72 176, 90 172, 100 160 Z" />
        <path class="hoja hoja--2" d="M100 128 C 125 118, 138 128, 142 138 C 128 144, 110 140, 100 128 Z" />
        <ellipse class="capullo" cx="100" cy="58" rx="7" ry="10" />
        <g class="flor">
          <ellipse cx="100" cy="46" rx="9" ry="16" transform="rotate(0 100 62)" />
          <ellipse cx="100" cy="46" rx="9" ry="16" transform="rotate(60 100 62)" />
          <ellipse cx="100" cy="46" rx="9" ry="16" transform="rotate(120 100 62)" />
          <ellipse cx="100" cy="46" rx="9" ry="16" transform="rotate(180 100 62)" />
          <ellipse cx="100" cy="46" rx="9" ry="16" transform="rotate(240 100 62)" />
          <ellipse cx="100" cy="46" rx="9" ry="16" transform="rotate(300 100 62)" />
          <circle class="flor-centro" cx="100" cy="62" r="8" />
        </g>
        <path class="maceta" d="M62 200 H138 L128 252 H72 Z" />
        <rect class="maceta-borde" x="54" y="192" width="92" height="14" rx="4" />
        <ellipse class="tierra" cx="100" cy="194" rx="38" ry="3" />
      </svg>
    </div>

    <div class="progreso" id="progreso" role="progressbar" aria-label="Crecimiento de la planta"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progreso-relleno" id="relleno"></div>
    </div>
    <p class="estado" id="estado" aria-live="polite">La semilla tiene sed.</p>
    <button class="replantar" id="replantar" type="button" hidden>Plantar otra semilla</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
