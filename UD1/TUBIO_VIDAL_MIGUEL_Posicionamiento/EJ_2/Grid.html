<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 2 - Grid</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      #contenedor {
        width: 100%;
        height: 100vh;
        padding: 14vh 4vw;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border: thin dotted brown;
      }
      .amarilla {
        background-color: khaki;
        border: thin solid dimgray;
      }
      .celeste {
        background-color: lightcyan;
        border: thin solid indianred;
      }
    </style>
  </head>
  <body>
    <div id="contenedor">
      <div class="amarilla"></div>
      <div class="celeste"></div>
    </div>
  </body>
</html>
