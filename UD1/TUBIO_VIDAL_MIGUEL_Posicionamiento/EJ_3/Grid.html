<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 3 - Grid</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      #contenedor {
        width: 100%;
        height: 100vh;
        padding: 2vh 1.5vw;
        border: medium solid black;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(4, 1fr);
        gap: 2vh 1.5vw;
        grid-template-areas:
          'verde azul'
          'verde morado'
          'rojo  morado'
          'rojo  morado';
      }
      .verde {
        background-color: green;
        grid-area: verde;
      }
      .rojo {
        background-color: red;
        grid-area: rojo;
      }
      .azul {
        background-color: blue;
        grid-area: azul;
      }
      .morado {
        background-color: blueviolet;
        grid-area: morado;
      }
    </style>
  </head>
  <body>
    <div id="contenedor">
      <div class="verde"></div>
      <div class="azul"></div>
      <div class="rojo"></div>
      <div class="morado"></div>
    </div>
  </body>
</html>
