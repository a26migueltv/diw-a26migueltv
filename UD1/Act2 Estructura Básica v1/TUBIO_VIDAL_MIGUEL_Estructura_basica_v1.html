<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TUBIO_VIDAL_MIGUEL_Estructura_basica_v1</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      #cabeceira {
        background-color: black;
        color: yellow;
        padding: 5px 15px;
        flex: 0 0 5vh;
      }
      #medio {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #navegacion a {
        display: block;
        padding-left: 55px;
        color: rgb(1, 255, 1);
      }
      #navegacion {
        width: 30%;
        background-color: rgb(143, 144, 145);
        padding-top: 30px;
      }
      #contido {
        width: 70%;
        background-color: rgb(226, 226, 226);
        color: rgb(200, 85, 204);
        font-size: 11px;
        padding: 20px 10px;
      }
      #pe {
        background-color: rgb(187, 187, 187);
        text-align: center;
        color: darkred;
        padding: 5px 0;
        flex: 0 0 5vh;
      }
    </style>
  </head>
  <body>
    <div id="cabeceira">
      <p>Párrafo en la cabecera de la página.</p>
    </div>
    <div id="medio">
      <div id="navegacion">
        <a href="#">Enlace 1</a>
        <a href="#">Enlace 2</a>
        <a href="#">Enlace 3</a>
      </div>

      <div id="contido">
        <h1>Ejemplo: Uso del elemento "div" y del atributo <em>id</em></h1>
      </div>
    </div>

    <div id="pe">
      <p>Párrafo en el pie de la página</p>
    </div>
  </body>
</html>
