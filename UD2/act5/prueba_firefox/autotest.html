<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba automática · Nami Ramen</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;background:#f3ece0;color:#1a1714}
h1{font-size:20px;margin:0 0 6px}
#marcos{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.marco{overflow:hidden;border:1px solid #bbb;background:#fff}
.marco iframe{border:0;transform-origin:0 0}
.marco p{margin:0;font-size:11px;padding:2px 4px;background:#ddd}
#resumen{font-size:22px;font-weight:700;margin:8px 0}
table{border-collapse:collapse;font-size:12px;width:100%}
td,th{border-bottom:1px solid #ccc;padding:3px 6px;text-align:left}
.ok{color:#2f6b3a;font-weight:700}.mal{color:#b8322a;font-weight:700}
#cols{columns:2;column-gap:24px}
</style>
</head>
<body>
<h1>Prueba automática de Nami Ramen</h1>
<div id="ua"></div>
<div id="resumen">Probando… (unos 15 segundos)</div>
<div id="marcos"></div>
<div id="cols"></div>
<script>
const pruebas=[['index',1366],['conocenos',1366],['carta',1366],['contacto',1366],['index',390],['carta',390],['contacto',390]];
const esc=0.17, alto=800;
const marcos=document.getElementById('marcos');
pruebas.forEach(([p,w])=>{const d=document.createElement('div');d.className='marco';d.style.width=(w*esc)+'px';
  d.innerHTML=`<p>${p} · ${w}px</p><div style="height:${alto*esc}px"><iframe src="${p}.html" width="${w}" height="${alto}" style="transform:scale(${esc})"></iframe></div>`;marcos.appendChild(d);});
let recibidos=0,total=0,fallos=0;
addEventListener('message',ev=>{const m=ev.data;if(!m||!m.autotest)return;recibidos++;
  document.getElementById('ua').textContent='Navegador: '+m.ua;
  let html=`<table><tr><th colspan="2">${m.pagina}.html · ${m.ancho}px</th></tr>`;
  m.res.forEach(r=>{total++;if(!r.ok)fallos++;html+=`<tr><td class="${r.ok?'ok':'mal'}">${r.ok?'✔':'✘'}</td><td>${r.nombre}${r.ok||!r.extra?'':' — '+r.extra}</td></tr>`});
  document.getElementById('cols').insertAdjacentHTML('beforeend',html+'</table><br>');
  document.getElementById('resumen').innerHTML=(recibidos<pruebas.length?`Probando… ${recibidos}/${pruebas.length} páginas · `:'TERMINADO · ')+`<span class="${fallos?'mal':'ok'}">${total-fallos} de ${total} pruebas correctas</span>`;
});
</script>
</body>
</html>
